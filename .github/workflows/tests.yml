name: tests

on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        binding: [pyside6, pyqt6]
        python: ["3.10", "3.12"]
    env:
      AIEDIT_QT: ${{ matrix.binding }}
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Системные библиотеки для Qt
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Установка
        run: pip install ".[${{ matrix.binding }}]" pyflakes
      - name: Линтер
        run: pyflakes aiedit tests
      - name: Тесты
        run: python -m unittest discover -s tests
