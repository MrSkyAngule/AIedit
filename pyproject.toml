[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aiedit"
version = "0.1.0"
description = "Code editor that lets AI models work on a project without seeing the code you closed"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "MrSkyAngel" }]
dependencies = []  # Qt-биндинг выбирается через extras: pyside6 или pyqt6

[project.optional-dependencies]
pyside6 = ["PySide6>=6.5"]
pyqt6 = ["PyQt6>=6.5"]
analyzers = ["ruff", "mypy", "bandit"]

[project.scripts]
aiedit = "aiedit.app:main"

[tool.setuptools]
packages = ["aiedit"]
